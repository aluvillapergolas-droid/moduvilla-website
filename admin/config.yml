backend:
  name: git-gateway
  branch: main

# 本地开发测试时可开启（线上会自动通过 Netlify 代理）
# local_backend: true

# 上传的媒体图片默认存放路径
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "_posts" # 你的 Markdown 文章存放目录，可根据实际调整
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "文章标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "文章摘要", name: "description", widget: "text"}
      - {label: "封面图片", name: "thumbnail", widget: "image", required: false}
      - {label: "正文内容", name: "body", widget: "markdown"}

  - name: "pages"
    label: "单页管理"
    files:
      - file: "index.md"
        label: "首页内容"
        name: "index"
        fields:
          - {label: "主标题", name: "title", widget: "string"}
          - {label: "副标题", name: "subtitle", widget: "string"}
          - {label: "正文介绍", name: "body", widget: "markdown"}